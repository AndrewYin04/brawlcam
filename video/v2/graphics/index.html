<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Throw Hands motion graphics</title>
<style>
@font-face { font-family: 'Bungee'; src: url('../fonts/Bungee-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'Inter'; src: url('../fonts/Inter-Variable-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
/* Brand tokens: copied from web/src/style.css :root */
:root {
  --bg: #070912; --panel: rgba(14, 18, 34, 0.86); --line: rgba(255, 255, 255, 0.12);
  --text: #eef2ff; --muted: #9aa6c8; --p1: #ff3d6e; --p2: #33b5ff; --gold: #ffc53d; --good: #3dff9a; --orange: #ff7a3d;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; color: var(--text); font-family: Inter, system-ui, sans-serif; }
body.opaque { background: var(--bg); }
#stage { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.bungee { font-family: 'Bungee', sans-serif; font-weight: 400; }
.center { position: absolute; left: 0; right: 0; text-align: center; }
.kicker { font-family: Inter; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); font-size: 30px; }
.word { display: inline-block; will-change: transform, opacity, filter; }
.glow-p1 { text-shadow: 0 0 38px rgba(255, 61, 110, 0.65), 0 8px 0 rgba(0, 0, 0, 0.55); }
.glow-p2 { text-shadow: 0 0 38px rgba(51, 181, 255, 0.65), 0 8px 0 rgba(0, 0, 0, 0.55); }
.glow-gold { text-shadow: 0 0 38px rgba(255, 140, 60, 0.7), 0 8px 0 rgba(0, 0, 0, 0.55); }
.glow-w { text-shadow: 0 0 30px rgba(255, 255, 255, 0.25), 0 8px 0 rgba(0, 0, 0, 0.55); }
svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="scenes.js"></script>
</body>
</html>
