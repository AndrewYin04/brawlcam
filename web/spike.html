<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Throw Hands pose check</title>
<style>
  body { margin: 0; background: #0b0d12; color: #e8ecf3; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  .panel { position: relative; width: min(100%, 480px); aspect-ratio: 4/3; background: #000; }
  video, canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #gl { width: min(100%, 480px); aspect-ratio: 4/3; display: block; }
  #hud { padding: 0 12px; font-family: ui-monospace, monospace; }
  button { font: inherit; padding: 8px 14px; }
</style>
</head>
<body>
<div id="hud">status: <span id="status">starting</span> | delegate: <span id="delegate">-</span> | pose fps: <span id="fps">0</span> | people: <span id="people">0</span> | infer ms: <span id="ms">-</span> | render fps: <span id="rfps">0</span></div>
<div id="wrap">
  <div class="panel"><video id="video" playsinline muted autoplay></video><canvas class="overlay" id="overlay"></canvas></div>
  <canvas id="gl"></canvas>
</div>
<script type="module" src="/src/spike.ts"></script>
</body>
</html>
